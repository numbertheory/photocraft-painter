[project]
name = "photocraft-painter"
version = "0.1.0"
description = "Live AI painter and composer for PhotoCraft using MCP bridge mode"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "ollama>=0.6.3",
]

[project.scripts]
photocraft-painter = "photocraft_painter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
